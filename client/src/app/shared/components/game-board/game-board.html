@let cells = board();

<div
  class="board grid grid-cols-3 gap-2 bg-[var(--color-dark-green)] w-fit mx-auto select-none p-2 rounded-lg shadow-xl"
  [class.is-disabled]="disabled()"
>
  @for (i of indices; track i) {
    <button
      type="button"
      class="cell flex items-center justify-center w-28 h-28 text-7xl font-black font-[Nunito] bg-[var(--color-light-green)] rounded-md transition-colors"
      [class.cell--clickable]="!disabled() && !cells[i]"
      [class.cell--winning]="isWinning(i)"
      [disabled]="disabled() || !!cells[i]"
      (click)="onCell(i)"
      [attr.aria-label]="'Cell ' + (i + 1) + (cells[i] ? ' ' + cells[i] : ' empty')"
    >
      @if (cells[i] === 'X') {
        <span class="mark mark--x text-[var(--color-x)]">X</span>
      } @else if (cells[i] === 'O') {
        <span class="mark mark--o text-[var(--color-o)]">O</span>
      }
    </button>
  }
</div>
